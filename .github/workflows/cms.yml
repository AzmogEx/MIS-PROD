name: CMS checks
on:
  pull_request:
  push:
    branches: [prod, main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run cms:setup
      - run: npm run cms:migrate
      - run: npm run cms:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cms
      - run: npm run build
